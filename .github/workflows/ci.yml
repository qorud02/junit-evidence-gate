name: Tests and installed CLI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install .
      - name: Run unit and CLI tests
        run: python -m unittest discover -s tests -v
      - name: Check all fixture exit codes
        run: python examples/run_demo.py
      - name: Check installed console command
        run: junit-evidence-gate examples/green.xml --min-executed 2 --max-skipped 1 --format markdown
      - name: Check installed GitHub annotation output
        run: junit-evidence-gate examples/green.xml --min-executed 2 --max-skipped 1 --format github
      - name: Check import outside checkout
        working-directory: ${{ runner.temp }}
        run: python -c "import junit_evidence_gate; print(junit_evidence_gate.__version__)"
