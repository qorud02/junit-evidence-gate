name: Surefire producer compatibility

on:
  push:
    paths:
      - 'junit_evidence_gate/**'
      - 'integrations/surefire/**'
      - 'examples/producers/surefire/**'
      - 'tests/test_surefire_reports.py'
      - '.github/workflows/surefire-producer.yml'
  pull_request:
    paths:
      - 'junit_evidence_gate/**'
      - 'integrations/surefire/**'
      - 'examples/producers/surefire/**'
      - 'tests/test_surefire_reports.py'
      - '.github/workflows/surefire-producer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  producer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          overwrite-settings: false
      - name: Download and verify pinned Maven
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output apache-maven-3.10.0-bin.tar.gz \
            https://dlcdn.apache.org/maven/maven-3/3.10.0/binaries/apache-maven-3.10.0-bin.tar.gz || \
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output apache-maven-3.10.0-bin.tar.gz \
            https://archive.apache.org/dist/maven/maven-3/3.10.0/binaries/apache-maven-3.10.0-bin.tar.gz
          echo '908b1501bfb420bf7c8affb855534a9c407fd6099367bfb9f2f2dcb8e9799102bffb84518cde74c679bd76870247c6528683abdd620581bffa90f95d92d175aa  apache-maven-3.10.0-bin.tar.gz' | sha512sum --check --strict
          tar -xzf apache-maven-3.10.0-bin.tar.gz
      - name: Verify real producer reports against committed fixtures
        run: >-
          python integrations/surefire/run.py
          --maven "$RUNNER_TEMP/apache-maven-3.10.0/bin/mvn"
          --keep-reports integrations/surefire/generated
      - name: Check fixture policy and CLI regressions
        run: python -m unittest discover -s tests -p test_surefire_reports.py -v
      - name: Retain sanitized producer reports and synthetic runner logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: surefire-producer-reports
          path: |
            integrations/surefire/generated/*.xml
            integrations/surefire/generated/*.log
          if-no-files-found: warn
          retention-days: 7
